name = "thaksheel-fire-safety"
main = "worker.js"
compatibility_date = "2026-10-13"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "thaksheel-fire-safety-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[ai]
binding = "AI"
